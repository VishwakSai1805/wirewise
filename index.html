<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wirewise — Computer networks, packet by packet</title>
    <meta name="description" content="A free, interactive computer networks course. Watch packets cross the network, inspect every header byte, and practise with labs on subnetting, CRC, sliding windows, routing and congestion control." />
    <meta name="theme-color" content="#0f1513" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('wirewise:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Wirewise needs JavaScript to run its animations and labs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
